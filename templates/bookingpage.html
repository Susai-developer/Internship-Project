<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Register Success</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
}

.success-box{
    width:420px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:40px 30px;
    text-align:center;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:zoom 1s ease;
}

@keyframes zoom{
    from{
        transform:scale(0.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.icon{
    width:100px;
    height:100px;
    background:#00c853;
    border-radius:50%;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin-bottom:25px;
    box-shadow:0 0 20px #00c853;
}

h1{
    font-size:34px;
    margin-bottom:15px;
}

p{
    font-size:16px;
    line-height:28px;
    color:#f1f1f1;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    padding:14px 35px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-size:18px;
    transition:0.4s;
    font-weight:bold;
}

.btn:hover{
    background:white;
    color:#ff9800;
    transform:scale(1.08);
}

</style>
</head>

<body>

<div class="success-box">

    <div class="icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>Booking Successful!</h1>

    <p>
        Welcome to <b>TravelX</b> ✈️ <br>
        Your travel booking has been created successfully.
        Get ready to explore amazing destinations around the world.
    </p>

    <a href="/book_suscess" class="btn">Start Your Journey</a>

</div>

</body>
</html>
