<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TravelX Booking Form</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
}

/* MAIN FORM BOX */

.booking-form{
    width:700px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:15px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* TITLE */

.booking-form h1{
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

.booking-form p{
    text-align:center;
    margin-bottom:40px;
    color:#eee;
    font-size:18px;
}

/* INPUT GRID */

.form-group{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

/* INPUT BOX */

.input-box{
    position:relative;
}

.input-box input,
.input-box select{
    width:100%;
    padding:16px 18px 16px 50px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:16px;
    background:rgba(255,255,255,0.2);
    color:white;
}

.input-box input::placeholder{
    color:#f1f1f1;
}

.input-box select{
    color:white;
}

.input-box option{
    color:black;
}

/* ICON */

.input-box i{
    position:absolute;
    left:18px;
    top:18px;
    font-size:18px;
    color:#fff;
}

/* TEXTAREA */

textarea{
    width:100%;
    height:120px;
    margin-top:25px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:20px;
    font-size:16px;
    resize:none;
    background:rgba(255,255,255,0.2);
    color:white;
}

textarea::placeholder{
    color:#f1f1f1;
}

/* BUTTON */

.btn{
    width:100%;
    margin-top:30px;
    padding:18px;
    border:none;
    border-radius:40px;
    background:#ff9800;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.4s;
    font-weight:bold;
}

.btn:hover{
    background:white;
    color:#ff9800;
    transform:scale(1.03);
}

/* MOBILE */

@media(max-width:850px){

    .booking-form{
        width:95%;
        padding:30px;
    }

    .form-group{
        grid-template-columns:1fr;
    }

    .booking-form h1{
        font-size:35px;
    }

}

</style>
</head>

<body>

<div class="booking-form">

<h1>Travel Booking</h1>

<p>Book Your Dream Vacation Around The World ✈️</p>

<form action="/registor2" method="POST">

<div class="form-group">

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" name="name" placeholder="Full Name">
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" name="your_email" placeholder="Email Address" required>
</div>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="text" name="phone" placeholder="Phone Number" required>
</div>

<div class="input-box">
<i class="fa-solid fa-location-dot"></i>

<select name="place" required>
<option>Select Destination</option>
<option>Maldives</option>
<option>Dubai</option>
<option>Paris</option>
<option>Singapore</option>
<option>Switzerland</option>
</select>

</div>

<div class="input-box">
<i class="fa-solid fa-calendar-days"></i>
<input type="date" name="start_date">
</div>

<div class="input-box">
<i class="fa-solid fa-users"></i>

<select name="person" required>
<option>Number Of Travelers</option>
<option>1 Person</option>
<option>2 Persons</option>
<option>3 Persons</option>
<option>4+ Persons</option>
</select>

</div>

</div>

<textarea name="Special_Request" placeholder="Special Requests"></textarea>

<button type="submit" class="btn">
    Confirm Booking
</button>

</form>

</div>

</body>
</html>
