<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <link rel="shortcut icon" href="ashwin.webp" type="image/x-icon">
    <title>Login Form</title>
    <style>
        body{
            background-color: skyblue;
        }
        .nisha{
            position: relative;
            left: 400px;
            top: 90px;
        }
        tr{
            position: relative;
            left: 100px;
        }
        td{
            padding: 15px;
            padding-top: 5px;
        }
        form{
            border: 1px solid black;
            width: 500px;
            height: 250px;
            padding: 10px;
            position: relative;
            top: 70px;
            

        }
        input:focus{
            border: 2px double aqua;
            outline: none;
        }
        h1{
            text-align: center;
        }
     
        hr{
            position: relative;
            bottom: 10px;
            
        }
        input:active{
            background-color: skyblue;
        }
        a:active{
            color: aqua;
            
        }
    </style>
</head>
<body>
    <div class="nisha">
    <form action="/registor" method="POST">
        <h1>Login Form</h1>
        <hr>
        <table>
            <tr>
                <td><label for="">Username</label></td>
                <td><input type="text" name="name" id="" placeholder="Enter username"></td>
            </tr>
            <tr>
                <td><label for="">Password</label></td>
                <td><input type="password" name="password" id="" placeholder="Enter password"></td>
            </tr>
            <tr>
                <td><button>login</button></td>
            </tr>
        </table>
    </form>
    </div>
</body>
</html>
